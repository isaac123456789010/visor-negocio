  storageBucket: "mio-negocio.firebasestorage.app",

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — header, tab views (bottom bar on phone, top tabs on desktop), slide-in panel for detail and forms. Dark by the owner's choice. */
:root{
  --bg:#0f1216; --surface:#171b21; --raised:#1f242c; --line:#2a313b;
  --fg:#e9edf2; --muted:#8c96a3; --faint:#5d6773;
  --accent:#e0a458; --accent-ink:#1a1206; --accent-soft:rgba(224,164,88,.14);
  --ok:#5cc98a; --ok-soft:rgba(92,201,138,.14);
  --bad:#f07a6a; --bad-soft:rgba(240,122,106,.14);
  --info:#8fb3d9; --info-soft:rgba(143,179,217,.14);
  --warn:#e7c35a; --warn-soft:rgba(231,195,90,.14);
  --f-display:"Outfit",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body.out .tabs,body.out #btnAjustes{display:none}
.brand{flex:1}
.brand>div{min-width:0}
.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(15,18,22,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.02em;flex:none}
.brand h1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.tabs{display:flex;gap:4px;margin-left:auto;flex:none}
.tab{background:none;border:0;padding:8px 14px;border-radius:9px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.tab svg{width:18px;height:18px}
.tab[aria-current="true"]{background:var(--raised);color:var(--fg)}
.tab:hover{color:var(--fg)}
.iconbtn{background:none;border:1px solid var(--line);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{color:var(--fg);border-color:var(--faint)}
.iconbtn svg{width:18px;height:18px}
main{max-width:1180px;margin:0 auto;padding:20px 16px 120px}
.view{display:grid;gap:20px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.view-head h2{font-size:26px}
.view-head p{margin:2px 0 0;color:var(--muted)}

@media (max-width:760px){
  .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;background:rgba(23,27,33,.97);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:30}
  .tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px;flex:1}
  .tab svg{width:22px;height:22px}
  .tab[aria-current="true"]{background:none;color:var(--accent)}
  .brand h1{font-size:16px}
  .view-head h2{font-size:22px}
  .fab{bottom:calc(76px + env(safe-area-inset-bottom,0px)) !important}
}

/* buttons */
.btn{border:1px solid var(--line);background:var(--raised);padding:10px 16px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:rgba(240,122,106,.35);background:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn svg{width:16px;height:16px}
.btn{text-decoration:none;color:inherit}
.btn.primary{color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.fab{position:fixed;right:max(16px,calc((100vw - 1180px)/2 + 16px));bottom:24px;z-index:25;box-shadow:0 10px 30px rgba(0,0,0,.45);padding:14px 20px;border-radius:14px;font-size:15px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.kpi .lbl{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.kpi .val{font-family:var(--f-display);font-size:26px;font-weight:600;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .sub{color:var(--muted);font-size:13px;margin-top:2px}
.kpi.hero{background:linear-gradient(160deg,#2a2116,var(--surface) 70%);border-color:rgba(224,164,88,.35)}
.kpi.hero .val{color:var(--accent)}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.kpi{padding:14px}.kpi .val{font-size:clamp(15px,4.4vw,22px);white-space:normal;overflow-wrap:anywhere}}

.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:16px}
.panel-h .link{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;padding:0}
.panel-b{padding:14px 16px}

/* money table */
.ledger{display:grid;gap:0}
.ledger .row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.ledger .row:last-child{border-bottom:0}
.ledger .row span:first-child{color:var(--muted)}
.ledger .row.total{border-top:1px solid var(--faint);border-bottom:0;margin-top:4px;padding-top:12px;font-weight:700}
.ledger .row.total span:first-child{color:var(--fg)}
.ledger .minus{color:var(--bad)}

/* status */
.statbar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--raised);margin:4px 0 12px}
.statbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted)}
.legend b{color:var(--fg);font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.moroso{background:var(--bad-soft);color:var(--bad)}
.pill.aldia{background:var(--ok-soft);color:var(--ok)}
.pill.pagado{background:var(--info-soft);color:var(--info)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.personal{background:var(--info-soft);color:var(--info)}
.pill.reinversion{background:var(--accent-soft);color:var(--accent)}

/* lists */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 260px;position:relative;min-width:0}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 14px 12px 40px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--faint)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--muted);padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{opacity:.7;margin-left:4px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.item:last-child{border-bottom:0}
button.item:hover{background:var(--raised)}
.code{font-family:var(--f-display);font-weight:600;color:var(--muted);font-size:14px;background:var(--raised);border-radius:8px;padding:6px 0;text-align:center}
.item .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .right{text-align:right;display:grid;gap:4px;justify-items:end}
.item .amt{font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--raised);border-radius:3px;overflow:hidden;margin-top:6px;max-width:260px}
.bar i{display:block;height:100%;background:var(--ok)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.more{display:block;width:100%;padding:12px;background:none;border:0;border-top:1px solid var(--line);color:var(--accent);font-weight:600}
.groupline{display:flex;justify-content:space-between;padding:10px 16px;background:var(--raised);color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line)}
.alerts{display:grid;gap:8px}
.alert{display:block;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--fg);font-size:14px;border:0;text-align:left;width:100%}
.alert b{color:var(--warn)}
button.alert:hover{filter:brightness(1.15)}

/* panel (drawer) */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}
.drawer-h{display:flex;align-items:flex-start;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 14px;border-bottom:1px solid var(--line)}
.drawer-h h3{font-size:20px}
.drawer-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
.drawer-h .iconbtn{margin-left:auto}
.drawer-b{flex:1;overflow:auto;padding:16px;display:grid;gap:18px;align-content:start}
.drawer-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.drawer-f .btn{flex:1}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{background:var(--raised);border-radius:10px;padding:10px 12px;min-width:0}
.fact .lbl{font-size:12px;color:var(--muted);font-weight:600}
.fact .v{font-weight:700;font-size:17px;margin-top:2px;overflow-wrap:anywhere}
.fact.big{grid-column:1/-1}
.fact.big .v{font-size:24px;font-family:var(--f-display)}
.contact{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.sect-t{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.pay{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pay:last-child{border-bottom:0}
.pay .when{color:var(--muted);font-size:13px;min-width:92px}
.pay .v{font-weight:700;flex:1;font-variant-numeric:tabular-nums}
.pay .n{display:block;color:var(--warn);font-size:12px;font-weight:500}
.mini{background:none;border:0;color:var(--faint);padding:6px;border-radius:7px}
.mini:hover{color:var(--fg);background:var(--raised)}
.mini svg{width:16px;height:16px;display:block}

/* forms */
form.f{display:grid;gap:14px}
.fld{display:grid;gap:6px;min-width:0}
.fld label{font-size:13px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);outline:none}
.fld .hint{font-size:12px;color:var(--faint)}
.fld .err{font-size:12px;color:var(--bad)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:420px){.row2{grid-template-columns:minmax(0,1fr)}}
.seg{display:grid;grid-template-columns:repeat(2,1fr);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:none;border:0;padding:9px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--fg)}
.choice{display:grid;gap:10px}
.choice button{display:flex;gap:14px;align-items:center;text-align:left;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:16px}
.choice button:hover{border-color:var(--accent)}
.choice b{display:block;font-size:16px}
.choice span{color:var(--muted);font-size:13px}
.choice svg{width:26px;height:26px;color:var(--accent);flex:none}
.pick{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.pick button{display:flex;width:100%;gap:10px;align-items:center;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px;text-align:left}
.pick button:hover,.pick button[aria-pressed="true"]{background:var(--raised)}
.pick button:last-child{border-bottom:0}
.pick .s{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100vw - 32px)}
.banner{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;color:var(--muted)}
.banner b{color:var(--fg)}
.skel{height:84px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface),var(--raised),var(--surface));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.muted{color:var(--muted)}
.hide-sm{}
@media (max-width:560px){.hide-sm{display:none}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="logo">MIO</div>
      <div><h1>MIO Muebles &amp; Electrodomésticos</h1><small id="sync">Conectando…</small></div>
    </div>
    <nav class="tabs" aria-label="Secciones">
      <button class="tab" data-tab="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
      <button class="tab" data-tab="clientes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M17 11a3 3 0 1 0 0-6M22 21c0-3-2-5-5-5.5"/></svg>Clientes</button>
      <button class="tab" data-tab="cobros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20M6 15h4"/></svg>Cobros</button>
      <button class="tab" data-tab="gastos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16l-3-2-3 2-2-2-2 2-3-2-3 2z"/><path d="M8 9h8M8 13h5"/></svg>Gastos</button>
    </nav>
    <button class="iconbtn" id="btnAjustes" title="Ajustes y copias" aria-label="Ajustes y copias"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>

<main id="main">
  <div class="view">
    <div class="view-head"><div><h2>Resumen del negocio</h2><p>Cargando ventas, abonos y gastos…</p></div></div>
    <div class="kpis"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  </div>
</main>

<button class="btn primary fab" id="fab" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Registrar</button>
<div id="overlay"></div>
<div id="toastBox"></div>

<script>
(() => {
/* ================= estado ================= */
const S = {
  db:null, dl:null, canWrite:true,
  ventas:new Map(), abonos:new Map(), gastos:new Map(),
  config:{diasMoroso:30}, loaded:{ventas:false,abonos:false,gastos:false},
  tab:'inicio', q:'', filtro:'todos', gFiltro:'todos', gMes:'todos', limit:60,
  panel:null
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (n < 0 ? '-$' : '$') + Math.abs(Math.round(n || 0)).toLocaleString('es-CO');
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fdate = s => { if(!s) return 'Sin fecha'; const [y,m,d] = s.split('-').map(Number); return `${d} ${MESES[m-1]} ${y}`; };
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const daysSince = s => { if(!s) return null; const [y,m,d] = s.split('-').map(Number); const t = new Date(); return Math.floor((new Date(t.getFullYear(),t.getMonth(),t.getDate()) - new Date(y,m-1,d)) / 864e5); };
const digits = s => String(s ?? '').replace(/\D/g,'');
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const ICON = {
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  cart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.5 11h11L21 8H6.5"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>',
  cash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>',
  receipt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16l-3-2-3 2-2-2-2 2-3-2-3 2z"/><path d="M8 9h8M8 13h5"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/><path d="M9 9.5c.5 2.5 2.5 4.5 5 5l1.2-1.2 2 1-.6 1.6c-3.5.3-8.3-4.5-8-8L10.2 7l1 2z"/></svg>'
};

/* ================= cálculos ================= */
function calc(){
  const byV = new Map();
  for (const [id,a] of S.abonos){ const k = a.ventaId || ''; if(!byV.has(k)) byV.set(k,[]); byV.get(k).push({...a,_id:id}); }
  for (const l of byV.values()) l.sort((x,y) => (x.fecha||'').localeCompare(y.fecha||''));
  const dm = Number(S.config.diasMoroso) || 30;
  const ventas = [...S.ventas.values()].map(v => {
    const ab = byV.get(v.id) || [];
    const abonado = ab.reduce((s,a) => s + (a.valor||0), 0);
    const saldo = (v.precio||0) - abonado;
    const ultimo = ab.length ? ab[ab.length-1].fecha : null;
    const dias = daysSince(ultimo || v.fecha);
    const estado = saldo <= 0 ? 'pagado' : (dias != null && dias > dm ? 'moroso' : 'aldia');
    return {...v, abonos:ab, abonado, saldo, ultimo, dias, estado};
  }).sort((a,b) => b.id.localeCompare(a.id));
  const gastos = [...S.gastos.entries()].map(([id,g]) => ({...g,_id:id}))
    .sort((a,b) => (b.fecha||'').localeCompare(a.fecha||''));
  const T = {
    ventas: ventas.reduce((s,v)=>s+(v.precio||0),0),
    costo: ventas.reduce((s,v)=>s+(v.costo||0),0),
    cobrado: [...S.abonos.values()].reduce((s,a)=>s+(a.valor||0),0),
    pendiente: ventas.reduce((s,v)=>s+Math.max(0,v.saldo),0),
    personal: gastos.filter(g=>g.tipo==='personal').reduce((s,g)=>s+(g.valor||0),0),
    reinversion: gastos.filter(g=>g.tipo==='reinversion').reduce((s,g)=>s+(g.valor||0),0),
  };
  T.ganancia = T.ventas - T.costo;
  T.gananciaCobrada = T.ventas ? T.cobrado / T.ventas * T.ganancia : 0;
  T.efectivo = T.cobrado - T.personal - T.reinversion;
  const cnt = {moroso:0,aldia:0,pagado:0};
  ventas.forEach(v => cnt[v.estado]++);
  const sinVenta = byV.get('') || [];
  const revisar = [];
  if (sinVenta.length) revisar.push({t:`<b>${sinVenta.length} abono${sinVenta.length>1?'s':''} sin venta asignada</b> por ${money(sinVenta.reduce((s,a)=>s+a.valor,0))}. Ábrelo y elige a qué venta pertenece.`, go:()=>openAbono(null,sinVenta[0])});
  ventas.filter(v=>!v.precio).forEach(v => revisar.push({t:`<b>Venta ${esc(v.id)}</b> (${esc(v.cliente)}) no tiene precio de venta.`, go:()=>openVenta(v.id)}));
  ventas.filter(v=>v.precio && v.saldo<0).forEach(v => revisar.push({t:`<b>Venta ${esc(v.id)}</b> (${esc(v.cliente)}) tiene ${money(-v.saldo)} abonados de más.`, go:()=>openVenta(v.id)}));
  [...S.abonos.entries()].filter(([,a])=>a.valor>0 && a.valor<10000).forEach(([id,a]) => revisar.push({t:`<b>Abono de ${money(a.valor)}</b> a la venta ${esc(a.ventaId)} parece mal escrito.`, go:()=>openAbono(null,{...a,_id:id})}));
  return {ventas, gastos, T, cnt, revisar, sinVenta};
}

/* ================= render ================= */
let raf = 0;
function render(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }
function ready(){ return S.loaded.ventas && S.loaded.abonos && S.loaded.gastos; }

function draw(){
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.tab === S.tab));
  $('#fab').hidden = !S.db || !S.canWrite;
  if (!S.db) return;
  if (!ready()) return;
  const C = calc(); S.C = C;
  const m = $('#main');
  const keepFocus = document.activeElement && document.activeElement.id === 'q' ? document.activeElement.selectionStart : null;
  if (S.tab === 'inicio') m.innerHTML = vInicio(C);
  else if (S.tab === 'clientes') m.innerHTML = vClientes(C);
  else if (S.tab === 'cobros') m.innerHTML = vCobros(C);
  else if (S.tab === 'gastos') m.innerHTML = vGastos(C);
  else if (S.tab === 'ajustes') m.innerHTML = vAjustes(C);
  bindView(C);
  if (keepFocus != null && $('#q')) { $('#q').focus(); $('#q').setSelectionRange(keepFocus,keepFocus); }
  if (S.panel) S.panel();
}

function vInicio(C){
  const {T,cnt,ventas} = C;
  const tot = cnt.moroso+cnt.aldia+cnt.pagado || 1;
  const top = ventas.filter(v=>v.estado==='moroso').sort((a,b)=>b.saldo-a.saldo).slice(0,6);
  const dm = S.config.diasMoroso || 30;
  return `<div class="view">
    ${!ventas.length ? `<div class="banner"><b>Todavía no hay datos.</b> Ve a Ajustes (el engranaje) → Cargar datos iniciales y elige el archivo datos-iniciales-mio.json.</div>` : ''}
    <div class="view-head"><div><h2>Resumen del negocio</h2><p>${ventas.length} ventas a crédito · actualizado al ${fdate(todayStr())}</p></div></div>
    <div class="kpis">
      <div class="kpi hero"><div class="lbl">Por cobrar</div><div class="val num">${money(T.pendiente)}</div><div class="sub">${cnt.moroso+cnt.aldia} clientes con saldo</div></div>
      <div class="kpi"><div class="lbl">Cobrado</div><div class="val num">${money(T.cobrado)}</div><div class="sub">${Math.round(T.ventas? T.cobrado/T.ventas*100:0)}% de lo vendido</div></div>
      <div class="kpi"><div class="lbl">Efectivo disponible</div><div class="val num" style="color:${T.efectivo<0?'var(--bad)':'var(--fg)'}">${money(T.efectivo)}</div><div class="sub">Cobrado menos gastos</div></div>
      <div class="kpi"><div class="lbl">Ganancia ya cobrada</div><div class="val num">${money(T.gananciaCobrada)}</div><div class="sub">de ${money(T.ganancia)} proyectada</div></div>
    </div>
    <div class="grid2">
      <div style="display:grid;gap:20px;min-width:0">
        <section class="panel"><div class="panel-h"><h3>Estado de la cartera</h3><button class="link" data-go="cobros">Ver cobros</button></div>
          <div class="panel-b">
            <div class="statbar"><i style="width:${cnt.moroso/tot*100}%;background:var(--bad)"></i><i style="width:${cnt.aldia/tot*100}%;background:var(--ok)"></i><i style="width:${cnt.pagado/tot*100}%;background:var(--info)"></i></div>
            <div class="legend"><span><i class="dot" style="background:var(--bad)"></i>Morosos <b>${cnt.moroso}</b></span><span><i class="dot" style="background:var(--ok)"></i>Al día <b>${cnt.aldia}</b></span><span><i class="dot" style="background:var(--info)"></i>Pagados <b>${cnt.pagado}</b></span></div>
            <p class="muted" style="font-size:13px;margin:10px 0 0">Moroso = más de ${dm} días sin abonar.</p>
          </div>
        </section>
        <section class="panel"><div class="panel-h"><h3>Morosos que más deben</h3><button class="link" data-go="cobros">Ver todos</button></div>
          ${top.length ? `<div>${top.map(itemVenta).join('')}</div>` : `<div class="empty">No hay clientes morosos.</div>`}
        </section>
      </div>
      <div style="display:grid;gap:20px;min-width:0">
        <section class="panel"><div class="panel-h"><h3>Cuentas del negocio</h3></div>
          <div class="panel-b ledger num">
            <div class="row"><span>Vendido a crédito</span><span>${money(T.ventas)}</span></div>
            <div class="row"><span>Costo de lo vendido</span><span class="minus">−${money(T.costo)}</span></div>
            <div class="row total"><span>Ganancia proyectada</span><span>${money(T.ganancia)}</span></div>
          </div>
          <div class="panel-b ledger num" style="border-top:1px solid var(--line)">
            <div class="row"><span>Dinero recibido (abonos)</span><span>${money(T.cobrado)}</span></div>
            <div class="row"><span>Gastos personales</span><span class="minus">−${money(T.personal)}</span></div>
            <div class="row"><span>Reinversión en mercancía</span><span class="minus">−${money(T.reinversion)}</span></div>
            <div class="row total"><span>Efectivo disponible</span><span>${money(T.efectivo)}</span></div>
          </div>
        </section>
        ${C.revisar.length ? `<section class="panel"><div class="panel-h"><h3>Para revisar</h3><span class="pill warn">${C.revisar.length}</span></div>
          <div class="panel-b alerts">${C.revisar.map((r,i)=>`<button class="alert" data-rev="${i}">${r.t}</button>`).join('')}</div></section>` : ''}
      </div>
    </div>
  </div>`;
}

function itemVenta(v){
  const pct = v.precio ? Math.min(100, v.abonado / v.precio * 100) : 0;
  const lab = {moroso:'Moroso',aldia:'Al día',pagado:'Pagado'}[v.estado];
  const extra = v.estado==='pagado' ? 'Pagado' : (v.dias!=null ? `${v.dias} días sin abonar` : '');
  return `<button class="item" data-venta="${esc(v.id)}">
    <span class="code">${esc(v.id)}</span>
    <span style="min-width:0"><span class="name" style="display:block">${esc(v.cliente)}</span><span class="meta" style="display:block">${esc(v.producto)} · ${esc(extra)}</span><span class="bar"><i style="width:${pct}%"></i></span></span>
    <span class="right"><span class="amt">${v.saldo>0?money(v.saldo):money(v.precio)}</span><span class="pill ${v.estado}">${lab}</span></span>
  </button>`;
}

function filtrarVentas(ventas){
  const q = norm(S.q).trim();
  return ventas.filter(v => {
    if (S.filtro !== 'todos' && v.estado !== S.filtro) return false;
    if (!q) return true;
    const qd = digits(q);
    return norm(v.cliente).includes(q) || norm(v.producto).includes(q) || v.id === q.padStart(3,'0') ||
      (qd.length >= 4 && (digits(v.cedula).includes(qd) || digits(v.telefono).includes(qd)));
  });
}

function vClientes(C){
  const {cnt} = C;
  const list = filtrarVentas(C.ventas);
  const shown = list.slice(0, S.limit);
  const chip = (k,l,n) => `<button class="chip" data-f="${k}" aria-pressed="${S.filtro===k}">${l}<span class="n">${n}</span></button>`;
  return `<div class="view">
    <div class="view-head"><div><h2>Clientes y ventas</h2><p>Cada venta a crédito con su saldo. Toca una para ver sus abonos o editarla.</p></div></div>
    <div class="toolbar">
      <div class="search">${ICON.search}<input id="q" type="search" placeholder="Buscar por nombre, código, cédula o teléfono" value="${esc(S.q)}" autocomplete="off"></div>
      <div class="chips">${chip('todos','Todos',C.ventas.length)}${chip('moroso','Morosos',cnt.moroso)}${chip('aldia','Al día',cnt.aldia)}${chip('pagado','Pagados',cnt.pagado)}</div>
    </div>
    <div class="list">${shown.length ? shown.map(itemVenta).join('') : `<div class="empty">No hay ventas que coincidan con “${esc(S.q)}”.</div>`}
    ${list.length > S.limit ? `<button class="more" id="more">Mostrar más (${list.length - S.limit} restantes)</button>` : ''}</div>
  </div>`;
}

function vCobros(C){
  const pend = C.ventas.filter(v => v.saldo > 0).sort((a,b) => (b.dias??0) - (a.dias??0));
  const mor = pend.filter(v=>v.estado==='moroso');
  return `<div class="view">
    <div class="view-head"><div><h2>Cobros pendientes</h2><p>Ordenados por quién lleva más días sin abonar. ${mor.length} morosos deben ${money(mor.reduce((s,v)=>s+v.saldo,0))}.</p></div></div>
    <div class="list">${pend.map(v => `
      <div class="item" style="grid-template-columns:52px minmax(0,1fr) auto">
        <span class="code">${esc(v.id)}</span>
        <button style="all:unset;cursor:pointer;min-width:0" data-venta="${esc(v.id)}"><span class="name" style="display:block">${esc(v.cliente)}</span>
          <span class="meta" style="display:block">${money(v.saldo)} · ${v.ultimo ? 'último abono ' + fdate(v.ultimo) : 'sin abonos'}</span></button>
        <span class="right"><span class="pill ${v.estado}">${v.dias} días</span>
          <span class="contact">${waLink(v) ? `<a class="btn sm ghost" href="${waLink(v)}" target="_blank" rel="noopener">${ICON.wa}<span class="hide-sm">WhatsApp</span></a>` : ''}
          <button class="btn sm" data-abonar="${esc(v.id)}">Abonar</button></span></span>
      </div>`).join('') || '<div class="empty">Nadie tiene saldo pendiente.</div>'}</div>
  </div>`;
}

function mesKey(f){ return f ? f.slice(0,7) : 'sin'; }
function mesLabel(k){ if (k==='sin') return 'Antes del sistema'; const [y,m] = k.split('-').map(Number); return `${MESES_L[m-1]} ${y}`; }
function vGastos(C){
  const all = C.gastos;
  const meses = [...new Set(all.map(g=>mesKey(g.fecha)))];
  const list = all.filter(g => (S.gFiltro==='todos' || g.tipo===S.gFiltro) && (S.gMes==='todos' || mesKey(g.fecha)===S.gMes));
  const cur = todayStr().slice(0,7);
  const thisM = all.filter(g=>mesKey(g.fecha)===cur);
  const sum = (arr,t) => arr.filter(g=>!t||g.tipo===t).reduce((s,g)=>s+(g.valor||0),0);
  const groups = new Map(); list.forEach(g => { const k = mesKey(g.fecha); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(g); });
  const chip = (k,l) => `<button class="chip" data-gf="${k}" aria-pressed="${S.gFiltro===k}">${l}</button>`;
  return `<div class="view">
    <div class="view-head"><div><h2>Gastos y reinversión</h2><p>Personal = gastos del día a día. Reinversión = mercancía comprada para vender.</p></div></div>
    <div class="kpis">
      <div class="kpi"><div class="lbl">Personal este mes</div><div class="val num">${money(sum(thisM,'personal'))}</div><div class="sub">${mesLabel(cur)}</div></div>
      <div class="kpi"><div class="lbl">Reinversión este mes</div><div class="val num">${money(sum(thisM,'reinversion'))}</div><div class="sub">${mesLabel(cur)}</div></div>
      <div class="kpi"><div class="lbl">Personal total</div><div class="val num">${money(C.T.personal)}</div></div>
      <div class="kpi"><div class="lbl">Reinversión total</div><div class="val num">${money(C.T.reinversion)}</div></div>
    </div>
    <div class="toolbar">
      <div class="chips">${chip('todos','Todos')}${chip('personal','Personal')}${chip('reinversion','Reinversión')}</div>
      <div class="fld" style="margin-left:auto"><select id="gMes" aria-label="Mes">${['todos',...meses].map(k=>`<option value="${k}" ${S.gMes===k?'selected':''}>${k==='todos'?'Todos los meses':mesLabel(k)}</option>`).join('')}</select></div>
    </div>
    <div class="list">${[...groups].map(([k,arr]) => `<div class="groupline"><span>${mesLabel(k)}</span><span class="num">${money(sum(arr))}</span></div>` +
      arr.map(g => `<button class="item" data-gasto="${esc(g._id)}" style="grid-template-columns:minmax(0,1fr) auto">
        <span style="min-width:0"><span class="name" style="display:block">${esc(g.descripcion || 'Sin descripción')}</span><span class="meta" style="display:block">${fdate(g.fecha)}${g.nota?' · '+esc(g.nota):''}</span></span>
        <span class="right"><span class="amt">${money(g.valor)}</span><span class="pill ${g.tipo}">${g.tipo==='personal'?'Personal':'Reinversión'}</span></span></button>`).join('')
    ).join('') || '<div class="empty">No hay gastos con ese filtro.</div>'}</div>
  </div>`;
}

function vAjustes(C){
  return `<div class="view" style="max-width:640px">
    <div class="view-head"><div><h2>Ajustes y copias</h2><p>Reglas del negocio y copias de seguridad.</p></div></div>
    <section class="panel"><div class="panel-h"><h3>Cuándo es moroso un cliente</h3></div><div class="panel-b">
      <form class="f" id="fAj"><div class="fld"><label for="ajDias">Días sin abonar para marcarlo como moroso</label>
      <input id="ajDias" type="number" min="1" max="365" value="${esc(S.config.diasMoroso||30)}" ${S.canWrite?'':'disabled'}></div>
      ${S.canWrite?'<div><button class="btn primary" type="submit">Guardar</button></div>':''}</form></div></section>
    <section class="panel"><div class="panel-h"><h3>Descargar copia (Excel / CSV)</h3></div><div class="panel-b" style="display:grid;gap:10px">
      <p class="muted" style="margin:0">Guarda una copia de vez en cuando. Se abre con Excel o Google Sheets.</p>
      <div class="contact"><button class="btn" data-csv="ventas">Ventas</button><button class="btn" data-csv="abonos">Abonos</button><button class="btn" data-csv="gastos">Gastos</button></div>
    </div></section>
    <section class="panel"><div class="panel-h"><h3>Cargar datos iniciales</h3></div><div class="panel-b" style="display:grid;gap:10px">
      <p class="muted" style="margin:0">Úsalo una sola vez: elige el archivo <b>datos-iniciales-mio.json</b> para pasar el historial que venía de Google Sheets. Si lo cargas otra vez no se duplica, pero vuelve a dejar esos registros como estaban al principio.</p>
      <div class="contact"><label class="btn" for="impFile">Elegir archivo…</label><input id="impFile" type="file" accept=".json,application/json" hidden></div>
      <span class="muted" id="impMsg" style="font-size:13px"></span>
    </div></section>
    <section class="panel"><div class="panel-h"><h3>Cuenta</h3></div><div class="panel-b" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between">
      <span class="muted">Sesión iniciada como <b style="color:var(--fg)">${esc(S.email||'')}</b></span><button class="btn" id="btnSalir">Cerrar sesión</button>
    </div></section>
  </div>`;
}

function waLink(v){
  const m = digits(v.telefono).match(/3\d{9}/);
  if (!m) return '';
  const nombre = (v.cliente||'').split(/[ /]/)[0];
  const msg = `Hola ${nombre}, le saluda MIO Muebles & Electrodomésticos. Le recordamos que el saldo pendiente de su compra (${v.producto}) es de ${money(v.saldo)}.${v.ultimo ? ' Su último abono fue el ' + fdate(v.ultimo) + '.' : ''} ¡Muchas gracias!`;
  return `https://wa.me/57${m[0]}?text=${encodeURIComponent(msg)}`;
}

function bindView(C){
  const m = $('#main');
  m.querySelectorAll('[data-venta]').forEach(b => b.onclick = () => openVenta(b.dataset.venta));
  m.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  m.querySelectorAll('[data-rev]').forEach(b => b.onclick = () => C.revisar[+b.dataset.rev].go());
  m.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.filtro = b.dataset.f; S.limit = 60; render(); });

function showPanel(html, bind){

function closePanel(){ S.panel = null; $('#overlay').innerHTML = ''; document.body.style.overflow = ''; }

const head = (t, sub) => `<div class="drawer-h"><div style="min-width:0"><h3>${t}</h3>${sub?`<p>${sub}</p>`:''}</div><button class="iconbtn" data-close aria-label="Cerrar">${ICON.close}</button></div>`;

function confirmBox(title, text, onYes){
  const box = document.createElement('div');
  box.innerHTML = `<div class="scrim" style="z-index:50"></div><div role="alertdialog" style="position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 32px));background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px">
    <h3 style="font-size:18px">${title}</h3><p class="muted" style="margin:0">${text}</p>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" data-no>Cancelar</button><button class="btn danger" data-yes style="background:var(--bad);color:#1b0b08;border-color:var(--bad)">Sí, borrar</button></div></div>`;
  document.body.appendChild(box);
  const close = () => box.remove();
  box.querySelector('.scrim').onclick = close; box.querySelector('[data-no]').onclick = close;
  box.querySelector('[data-yes]').onclick = async () => { close(); await onYes(); };
}

/* ================= utilidades ================= */
let toastT;
function toast(msg){ clearTimeout(toastT); $('#toastBox').innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; toastT = setTimeout(() => $('#toastBox').innerHTML = '', 2600); }
async function copy(t){ try { await navigator.clipboard.writeText(t); toast('Número copiado'); } catch(e) { toast('No se pudo copiar: ' + t); } }
async function write(fn, okMsg){
  if (!S.db) return false;
  try { await fn(); toast(okMsg); return true; }
  catch(e){
    const c = e && e.code;
    if (c === 'permission-denied') { S.canWrite = false; render(); toast('No tienes permiso para cambiar datos en esta página'); }
    else if (c === 'unavailable') toast('Sin conexión: se guardará cuando vuelva el internet');
    else toast('No se pudo guardar. Intenta de nuevo');
    return false;
  }
}
function csvCell(v){ const s = String(v ?? ''); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }
async function exportCSV(kind){
  const C = S.C || calc(); let rows;
  if (kind === 'ventas') rows = [['Código','Fecha','Cliente','Producto','Precio','Costo','Abonado','Saldo','Estado','Último abono','Cédula','Teléfono','Nota'],
    ...C.ventas.slice().reverse().map(v => [v.id,v.fecha,v.cliente,v.producto,v.precio,v.costo,v.abonado,v.saldo,{moroso:'Moroso',aldia:'Al día',pagado:'Pagado'}[v.estado],v.ultimo||'',v.cedula,v.telefono,v.nota||''])];
  else if (kind === 'abonos') rows = [['Fecha','Código venta','Cliente','Valor','Nota'],
    ...[...S.abonos.values()].sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')).map(a => [a.fecha,a.ventaId,S.ventas.get(a.ventaId)?.cliente||'',a.valor,a.nota||''])];
  else rows = [['Fecha','Tipo','Valor','Descripción','Nota'], ...C.gastos.slice().reverse().map(g => [g.fecha||'',g.tipo==='personal'?'Personal':'Reinversión',g.valor,g.descripcion||'',g.nota||''])];
  const csv = '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a'); a.href = url; a.download = `mio-${kind}-${todayStr()}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ================= conexión a datos ================= */
function subscribeYears(name){
  const yNow = new Date().getFullYear();
  const years = [0]; for (let y = 2024; y <= yNow + 1; y++) years.push(y);
  const parts = new Map(); let pending = years.length;
  years.forEach(y => {
    unsubs.push(S.db.collection(name).where('anio','==',y).limit(1000).onSnapshot(snap => {
      parts.set(y, snap.docs);
      if (pending > 0 && !snap.metadata.fromCache) pending--;
      const m = new Map(); for (const docs of parts.values()) for (const d of docs) m.set(d.id, d.data());
      S[name] = m;
      if (parts.size === years.length) S.loaded[name] = true;
      setSync(); render();
    }, err => { setSync('error'); if (err && err.code === 'permission-denied') noDb('Tu correo no tiene permiso para ver los datos. Pídele al administrador que lo agregue en las reglas de Firestore.'); }));
  });
}
function setSync(state){
  const el = $('#sync');
  if (state === 'error') { el.textContent = 'Error al leer los datos'; return; }
  if (!S.db) { el.textContent = 'Sin sesión'; return; }
  el.textContent = ready() ? 'Control de ventas a crédito' : 'Cargando datos…';
}

let unsubs = [];
function resetData(){ unsubs.forEach(u => { try{u()}catch(e){} }); unsubs = []; S.ventas = new Map(); S.abonos = new Map(); S.gastos = new Map(); S.loaded = {ventas:false,abonos:false,gastos:false}; }

async function importar(file){
  const msg = $('#impMsg'); if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const writes = [];
    for (const col of ['ventas','abonos','gastos','config']) for (const [id,doc] of Object.entries(data[col] || {})) writes.push([col,id,doc]);
    if (!writes.length) { msg.textContent = 'Ese archivo no tiene datos del negocio.'; return; }
    for (let i = 0; i < writes.length; i += 400) {
      const b = S.db.batch();
      writes.slice(i, i + 400).forEach(([c,id,d]) => b.set(S.db.collection(c).doc(id), d));
      msg.textContent = `Cargando… ${Math.min(i + 400, writes.length)} de ${writes.length}`;
      await b.commit();
    }
    msg.textContent = `Listo: se cargaron ${writes.length} registros.`; toast('Datos cargados');
  } catch(e) {
    msg.textContent = e && e.code === 'permission-denied' ? 'Tu correo no tiene permiso para guardar datos (revisa las reglas de Firestore).' : 'No se pudo leer o cargar el archivo.';
  }
}

function loginView(err){
  $('#fab').hidden = true; document.body.classList.add('out');
  $('#main').innerHTML = `<div class="view" style="max-width:420px;margin:6vh auto 0">
    <div class="panel"><div class="panel-b" style="display:grid;gap:16px;padding:24px">
      <div class="brand"><div class="logo">MIO</div><div><h1 style="font-size:18px">Control del negocio</h1><small>Inicia sesión para continuar</small></div></div>
      <form class="f" id="fLogin">
        <div class="fld"><label for="lEmail">Correo</label><input id="lEmail" type="email" autocomplete="username" required></div>
        <div class="fld"><label for="lPass">Contraseña</label><input id="lPass" type="password" autocomplete="current-password" required></div>
        <span class="err" id="lErr" style="color:var(--bad);font-size:13px">${esc(err||'')}</span>
        <button class="btn primary" type="submit">Entrar</button>
        <button class="btn ghost" type="button" id="lReset">Olvidé mi contraseña</button>
      </form>
    </div></div></div>`;
  $('#fLogin').onsubmit = async e => {
    e.preventDefault(); $('#lErr').textContent = 'Entrando…';
    try { await firebase.auth().signInWithEmailAndPassword($('#lEmail').value.trim(), $('#lPass').value); }
    catch(e2) { $('#lErr').textContent = /wrong-password|invalid-credential|user-not-found|invalid-login/.test(e2.code||'') ? 'Correo o contraseña incorrectos.' : e2.code === 'auth/network-request-failed' ? 'Sin internet. Revisa la conexión.' : 'No se pudo entrar: ' + (e2.code||e2.message); }
  };
  $('#lReset').onclick = async () => {
    const em = $('#lEmail').value.trim(); if (!em) { $('#lErr').textContent = 'Escribe tu correo arriba y vuelve a tocar aquí.'; return; }
    try { await firebase.auth().sendPasswordResetEmail(em); $('#lErr').textContent = 'Te enviamos un correo para cambiar la contraseña.'; }
    catch(e2) { $('#lErr').textContent = 'No se pudo enviar el correo.'; }
  };
}

async function start(){
  const initial = (location.hash || '').slice(1);
  if (['inicio','clientes','cobros','gastos','ajustes'].includes(initial)) S.tab = initial;
  if (typeof firebase === 'undefined') { noDb('No se pudo cargar la app. Revisa tu conexión a internet y recarga la página.'); return; }
  if (!FIREBASE_CONFIG.projectId || FIREBASE_CONFIG.projectId === 'PEGA_AQUI') { noDb('Falta pegar la configuración de Firebase al principio del archivo index.html.'); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.firestore();
  try { await db.enablePersistence({synchronizeTabs:true}); } catch(e) {}
  S.dl = true;
  firebase.auth().onAuthStateChanged(user => {
    resetData(); closePanel();
    if (!user) { S.db = null; S.email = ''; $('#sync').textContent = 'Sin sesión'; loginView(); return; }
    document.body.classList.remove('out');
    S.db = db; S.email = user.email; S.canWrite = true;
    unsubs.push(db.doc('config/general').onSnapshot(s => { if (s.exists) S.config = {...S.config, ...s.data()}; render(); }, () => {}));
    ['ventas','abonos','gastos'].forEach(subscribeYears);
    $('#main').innerHTML = `<div class="view"><div class="view-head"><div><h2>Resumen del negocio</h2><p>Cargando ventas, abonos y gastos…</p></div></div><div class="kpis"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>`;
    setSync(); render();
  });
}
function noDb(text){
  $('#sync').textContent = 'Sin conexión';
  $('#main').innerHTML = `<div class="view"><div class="banner"><b>${esc(text)}</b></div></div>`;
}
start();
})();
</script>
</body>
</html>
